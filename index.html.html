<script id="question-data" type="application/json">[{"id": 1, "lesson": 1, "number": 1, "type": "mcq", "topic": "lesson1", "stem": "Tập đoàn __________ đã thực hiện chương trình cải tạo xã hội theo mô hình cực đoan, khiến đất nước Chùa Tháp rơi vào cảnh hỗn loạn.", "options": [{"key": "A", "text": "Pol Pot – leng Sary."}, {"key": "B", "text": "Campuchia."}, {"key": "C", "text": "Hitler."}, {"key": "D", "text": "Donal."}], "answer": "A", "basis": "file", "explanation": "Tên cần điền theo đề cương là tập đoàn Pol Pot – Ieng Sary, lực lượng thực hiện chính sách cực đoan và chế độ diệt chủng ở Campuchia.", "note": "", "passage": [], "promptTail": ""}, {"id": 2, "lesson": 1, "number": 2, "type": "mcq", "topic": "lesson1", "stem": "Mặt trận Đoàn kết dân tộc cứu nước Campuchia ra đời vào", "options": [{"key": "A", "text": "30/4/1977."}, {"key": "B", "text": "2/12/1978."}, {"key": "C", "text": "6/5/1954."}, {"key": "D", "text": "3/11/1956."}], "answer": "B", "basis": "file", "explanation": "Mặt trận Đoàn kết dân tộc cứu nước Campuchia ra đời ngày 2/12/1978. Phân biệt với mốc giải phóng Phnom Penh 7/1/1979.", "note": "", "passage": [], "promptTail": ""}, {"id": 3, "lesson": 1, "number": 3, "type": "mcq", "topic": "lesson1", "stem": "Pol Pot cho quân đổ bộ đánh chiếm đảo Phú Quốc vào thời gian nào?", "options": [{"key": "A", "text": "Trước ngày 19/3/1976."}, {"key": "B", "text": "Sau ngày 19/3/1976."}, {"key": "C", "text": "Trước ngày 30/4/1977."}, {"key": "D", "text": "Sau ngày 30/4/1977."}], "answer": "C", "basis": "file", "explanation": "File chọn C. Tuy nhiên, mốc lịch sử là 3/5/1975: sự kiện vừa trước 19/3/1976 (A), vừa trước 30/4/1977 (C). Vì thế câu này có hai phương án phù hợp về thời gian. Chế độ rà soát chấp nhận cả A và C; chế độ theo file giữ C.", "note": "Hai phương án A và C cùng phù hợp với mốc 3/5/1975.", "passage": [], "promptTail": "", "reviewAnswers": ["A", "C"]}, {"id": 4, "lesson": 1, "number": 4, "type": "mcq", "topic": "lesson1", "stem": "Thủ đô Phnom Penh được giải phóng vào", "options": [{"key": "A", "text": "7/1/1979."}, {"key": "B", "text": "3/2/1954."}, {"key": "C", "text": "30/4/1975."}, {"key": "D", "text": "19/8/1979."}], "answer": "A", "basis": "file", "explanation": "Thủ đô Phnom Penh được giải phóng ngày 7/1/1979. Đây là mốc khác với ngày thành lập Mặt trận 2/12/1978.", "note": "", "passage": [], "promptTail": ""}, {"id": 5, "lesson": 1, "number": 5, "type": "mcq", "topic": "lesson1", "stem": "Sáng 17/2/1979, chính quyền Trung Quốc đã mở cuộc tiến công quy mô lớn dọc tuyến biên giới từ______________ đến______________.", "options": [{"key": "A", "text": "Phong Thổ (Lai Châu) – Thanh Miện (Hải Dương)."}, {"key": "B", "text": "Từ Sơn (Bắc Ninh) – Vũ Thư (Thái Bình)."}, {"key": "C", "text": "Hưng Hà (Thái Bình) – Móng Cái (Quảng Ninh)."}, {"key": "D", "text": "Móng Cái (Quảng Ninh) – Phong Thổ (Lai Châu)."}], "answer": "D", "basis": "file", "explanation": "Tuyến biên giới được hỏi kéo dài từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu). Ghi nhớ hai đầu tuyến, không nhầm với địa danh ở đồng bằng.", "note": "", "passage": [], "promptTail": ""}, {"id": 6, "lesson": 1, "number": 6, "type": "mcq", "topic": "lesson1", "stem": "Ai là người kí Sắc lệnh 29 – LCT?", "options": [{"key": "A", "text": "Tổng bí thư Nông Đức Mạnh."}, {"key": "B", "text": "Chủ tịch nước Tôn Đức Thắng."}, {"key": "C", "text": "Chủ tịch Hồ Chí Minh."}, {"key": "D", "text": "Thủ tướng Phạm Minh Chính."}], "answer": "B", "basis": "file", "explanation": "Chủ tịch nước Tôn Đức Thắng là người kí Sắc lệnh 29-LCT. Cần tách ba dữ kiện: người kí, ngày kí và nội dung tổng động viên.", "note": "", "passage": [], "promptTail": ""}, {"id": 7, "lesson": 1, "number": 7, "type": "mcq", "topic": "lesson1", "stem": "Sắc lệnh 29 – LCT được kí vào thời gian", "options": [{"key": "A", "text": "5/3/1979."}, {"key": "B", "text": "3/5/1979."}, {"key": "C", "text": "17/2/1979."}, {"key": "D", "text": "19/1/1979."}], "answer": "A", "basis": "file", "explanation": "Sắc lệnh 29-LCT được kí ngày 5/3/1979. Tránh đảo ngày, tháng thành 3/5/1979; ngày 17/2/1979 là mốc mở cuộc tiến công ở biên giới phía Bắc.", "note": "", "passage": [], "promptTail": ""}, {"id": 8, "lesson": 1, "number": 8, "type": "mcq", "topic": "lesson1", "stem": "Năm ___________ chính quyền Trung Quốc đưa quân đánh, chiếm đóng trái phép nhóm đảo phía Đông quần đảo Hoàng Sa.", "options": [{"key": "A", "text": "1956."}, {"key": "B", "text": "1974."}, {"key": "C", "text": "1979."}, {"key": "D", "text": "1982."}], "answer": "A", "basis": "file", "explanation": "Theo đề cương, năm 1956 gắn với việc Trung Quốc chiếm đóng nhóm đảo phía Đông quần đảo Hoàng Sa. Không nhầm với mốc năm 1974.", "note": "", "passage": [], "promptTail": ""}, {"id": 9, "lesson": 1, "number": 9, "type": "mcq", "topic": "lesson1", "stem": "Trong cuộc đấu tranh bảo vệ chủ quyền biển, đảo, Việt Nam nhất quán giải quyết các tranh chấp bằng biện pháp", "options": [{"key": "A", "text": "nhất quán với các chủ trương của Đảng và Nhà nước."}, {"key": "B", "text": "quyết tử cho Tổ quốc quyết sinh."}, {"key": "C", "text": "hòa bình, phù hợp với luật pháp quốc tế."}, {"key": "D", "text": "tuyên bố chủ quyền biển đảo."}], "answer": "C", "basis": "file", "explanation": "Chọn biện pháp hòa bình, phù hợp với luật pháp quốc tế. Đây là nguyên tắc xuyên suốt được nhắc lại ở câu 30 của Bài 1.", "note": "", "passage": [], "promptTail": ""}, {"id": 10, "lesson": 1, "number": 10, "type": "mcq", "topic": "lesson1", "stem": "Đối với quần đảo Trường Sa, có ____ nước, ______ bên tuyên bố chủ quyền toàn bộ hay một phần đảo này.", "options": [{"key": "A", "text": "6;7."}, {"key": "B", "text": "4;5."}, {"key": "C", "text": "3;4."}, {"key": "D", "text": "5; 6."}], "answer": "D", "basis": "file", "explanation": "Đề cương dùng cách đếm 5 nước, 6 bên có yêu sách đối với toàn bộ hoặc một phần quần đảo Trường Sa. Phân biệt “nước” với “bên”; việc có yêu sách không đồng nghĩa yêu sách đó được công nhận.", "note": "", "passage": [], "promptTail": ""}, {"id": 11, "lesson": 1, "number": 11, "type": "mcq", "topic": "lesson1", "stem": "Nước nào sau đây không tuyên bố chủ quyền toàn bộ hay một phần đối với quần đảo Trường Sa?", "options": [{"key": "A", "text": "Việt Nam."}, {"key": "B", "text": "Trung Quốc."}, {"key": "C", "text": "Hàn Quốc."}, {"key": "D", "text": "Philippines."}], "answer": "C", "basis": "file", "explanation": "Hàn Quốc không thuộc các bên có yêu sách đối với quần đảo Trường Sa trong các phương án đã cho.", "note": "", "passage": [], "promptTail": ""}, {"id": 12, "lesson": 1, "number": 12, "type": "mcq", "topic": "lesson1", "stem": "Đấu tranh bảo vệ chủ quyền biển, đảo còn khẳng định", "options": [{"key": "A", "text": "sức mạnh về đấu tranh quân sự, chính trị, kinh tế, ngoại giao của Việt Nam."}, {"key": "B", "text": "tính chính nghĩa, khát vọng hòa bình, tôn trọng luật pháp quốc tế của dân tộc Việt Nam."}, {"key": "C", "text": "mối quan hệ của Việt Nam với các nước trên trường quốc tế."}, {"key": "D", "text": "sự phát triển về kinh tế - chính trị của Việt Nam so với các nước lân cận."}], "answer": "B", "basis": "file", "explanation": "Ý cần chọn nói về tính chính nghĩa, khát vọng hòa bình và sự tôn trọng luật pháp quốc tế, không chỉ nói đến sức mạnh hay phát triển kinh tế.", "note": "", "passage": [], "promptTail": ""}, {"id": 13, "lesson": 1, "number": 13, "type": "mcq", "topic": "lesson1", "stem": "Ý nào sau đây thể hiện trách nhiệm của công dân đối với sự nghiệp củng cố quốc phòng, an ninh?", "options": [{"key": "A", "text": "Đăng kí nghĩa vụ quân sự theo đúng quy định của pháp luật."}, {"key": "B", "text": "Hạn chế tham gia các hoạt động tri ân người có công với đất nước."}, {"key": "C", "text": "Không tham gia hoạt động đền ơn đáp nghĩa do địa phương tổ chức."}, {"key": "D", "text": "Chỉ đăng kí nghĩa vụ quân sự khi bị ép buộc."}], "answer": "A", "basis": "file", "explanation": "Đăng kí nghĩa vụ quân sự đúng quy định là biểu hiện trách nhiệm công dân. Những phương án hạn chế hoạt động tri ân hoặc chỉ thực hiện khi bị ép buộc không phù hợp.", "note": "", "passage": [], "promptTail": ""}, {"id": 14, "lesson": 1, "number": 14, "type": "mcq", "topic": "lesson1", "stem": "Ý không đúng về trách nhiệm của công dân đối với sự nghiệp củng cố quốc phòng, an ninh là", "options": [{"key": "A", "text": "chủ động tìm hiểu, học tập nắm chắc đường lối, chủ trương của Đảng, chính sách, pháp luật của Nhà nước nói chung."}, {"key": "B", "text": "tập trung học tập, hạn chế rèn luyện sức khỏe."}, {"key": "C", "text": "có trách nhiệm trong các hoạt động phụng dưỡng bà mẹ Việt Nam anh hùng."}, {"key": "D", "text": "tích cực đấu tranh với các âm mưu, thủ đoạn chia rẽ khối đại đoàn kết toàn dân tộc Việt Nam."}], "answer": "B", "basis": "file", "explanation": "Chú ý từ “không đúng”. Học tập cần đi cùng rèn luyện sức khỏe; vì vậy ý hạn chế rèn luyện sức khỏe là ý cần loại.", "note": "", "passage": [], "promptTail": ""}, {"id": 15, "lesson": 1, "number": 15, "type": "mcq", "topic": "lesson1", "stem": "Tội ác mà lực lượng Khmer Đỏ gây cho nhân dân ta là", "options": [{"key": "A", "text": "phá đồi, núi, săn bắn động vật hoang dã."}, {"key": "B", "text": "rải chất độc hóa học phá hoại mùa màng."}, {"key": "C", "text": "thả bom bắn phá nhiều cứ điểm của bộ đội ta."}, {"key": "D", "text": "giết hại dã man nhiều đồng bào ta, cướp bóc tài sản, phá hoại hoa màu, nhà cửa."}], "answer": "D", "basis": "file", "explanation": "Phương án D mô tả những tội ác đối với tính mạng, tài sản và đời sống của đồng bào ở khu vực biên giới trong nội dung bài học.", "note": "", "passage": [], "promptTail": ""}, {"id": 16, "lesson": 1, "number": 16, "type": "mcq", "topic": "lesson1", "stem": "Mục đích thành lập của Mặt trận Đoàn kết dân tộc cứu nước Campuchia là", "options": [{"key": "A", "text": "liên hợp với các nước khác để giành lại độc lập."}, {"key": "B", "text": "khôi phục lại chế độ chiếm hữu nô lệ."}, {"key": "C", "text": "lật đổ chế độ diệt chủng, khôi phục lại đất nước."}, {"key": "D", "text": "thúc đẩy phát triển kinh tế."}], "answer": "C", "basis": "file", "explanation": "Mục tiêu trực tiếp của Mặt trận là lật đổ chế độ diệt chủng và khôi phục đất nước, không phải khôi phục chế độ nô lệ hay chỉ phát triển kinh tế.", "note": "", "passage": [], "promptTail": ""}, {"id": 17, "lesson": 1, "number": 17, "type": "mcq", "topic": "lesson1", "stem": "Nhân tố có ý nghĩa quyết định để quân và dân ta thực hiện thắng lợi chiến tranh bảo vệ Tổ quốc ở biên giới Tây Nam là", "options": [{"key": "A", "text": "kết hợp kịp thời với các lực lượng của các nước yêu chuộng hòa bình."}, {"key": "B", "text": "Sự sụp đổ của lực lượng Khmer Đỏ."}, {"key": "C", "text": "Đảng đã đề ra chủ trương, đường lối, mục tiêu chính trị đúng đắn, sáng tạo."}, {"key": "D", "text": "chế độ Pol Pot có nhiều lỗ hổng, thiếu sót trong khâu quản lí."}], "answer": "C", "basis": "file", "explanation": "Theo bài học và phương án tô đỏ, đường lối, chủ trương và mục tiêu chính trị đúng đắn, sáng tạo là nhân tố có ý nghĩa quyết định. Chú ý yêu cầu hỏi nhân tố “quyết định”.", "note": "", "passage": [], "promptTail": ""}, {"id": 18, "lesson": 1, "number": 18, "type": "mcq", "topic": "lesson1", "stem": "Sắc lệnh 29 – LCT được đưa ra nhằm mục đích gì?", "options": [{"key": "A", "text": "Tổng động viên nhân dân thúc đẩy sản xuất nông nghiệp."}, {"key": "B", "text": "Tổng động viên trong cả nước đứng lên chống quân xâm lược, bảo vệ Tổ quốc."}, {"key": "C", "text": "Khuyến khích nhân dân tập trung phát triển kinh tế."}, {"key": "D", "text": "Lên án các hành vi của chính quyền Trung Quốc."}], "answer": "B", "basis": "file", "explanation": "Sắc lệnh 29-LCT nhằm tổng động viên cả nước chống quân xâm lược, bảo vệ Tổ quốc. Không nhầm với động viên sản xuất hoặc một tuyên bố ngoại giao.", "note": "", "passage": [], "promptTail": ""}, {"id": 19, "lesson": 1, "number": 19, "type": "mcq", "topic": "lesson1", "stem": "Mục đích của cuộc chiến tranh bảo vệ biên giới Tây Nam là", "options": [{"key": "A", "tex , "lesson": 1, "number": 22, "type": "mcq", "topic": "lesson1", "stem": "Ý không đúng khi nói về giá trị lịch sử của cuộc chiến tranh bảo vệ biên giới phía Bắc là", "options": [{"key": "A", "text": "thể hiện truyền thống nhân đạo, khát vọng hòa bình, mong muốn chấm dứt chiến tranh."}, {"key": "B", "text": "khẳng định chủ quyền, quyền chủ quyền, quyền tài phán của quốc gia Việt Nam trên các vùng biển, đảo của Tổ quốc theo Công ước Liên hợp quốc về Luật Biển năm 1982."}, {"key": "C", "text": "thể hiện ý chí, sức mạnh bền bỉ của nhân dân Việt Nam, quyết tâm vượt mọi khó khăn, thử thách để bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc."}, {"key": "D", "text": "viết tiếp trang sử vẻ vang trong sự nghiệp chống giặc ngoại xâm của dân tộc."}], "answer": "B", "basis": "file", "explanation": "Chú ý “không đúng” và phạm vi “biên giới phía Bắc”. Nội dung về quyền trên các vùng biển, đảo theo UNCLOS 1982 thuộc phần biển đảo, không phải giá trị riêng của cuộc chiến này.", "note": "", "passage": [], "promptTail": ""}, {"id": 23, "lesson": 1, "number": 23, "type": "mcq", "topic": "lesson1", "stem": "Trong cuộc chiến tranh bảo vệ biên giới Tây Nam, chúng ta đã thực hiện quyền tự vệ chính đáng bằng cách nào?", "options": [{"key": "A", "text": "Quân và dân các tỉnh biên giới trực tiếp chiến đấu bảo vệ Tổ quốc, đồng thời nhờ sự lên án mạnh mẽ của dư luận tiến bộ trên thế giới."}, {"key": "B", "text": "Kết hợp với lực lượng quân đội ở các nước khác để bảo vệ chủ quyền lãnh thổ."}, {"key": "C", "text": "Sử dụng lực lượng tại chỗ phòng ngự ngăn chặn địch, kết hợp với phản công, khôi phục lại các đảo và vùng lãnh thổ."}, {"key": "D", "text": "Xây nhiều thành lũy ngăn chặn sự tấn công của địch."}], "answer": "C", "basis": "file", "explanation": "Phương án C diễn đạt việc thực hiện quyền tự vệ, ngăn chặn sự xâm phạm và khôi phục lãnh thổ theo nội dung bài. Đây là kiến thức lịch sử trong đề cương.", "note": "", "passage": [], "promptTail": ""}, {"id": 24, "lesson": 1, "number": 24, "type": "mcq", "topic": "lesson1", "stem": "“Lấy nhỏ đánh lớn, lấy ít địch nhiều” là nghệ thuật quân sự trong", "options": [{"key": "A", "text": "chiến tranh bảo vệ biên giới Tây Nam."}, {"key": "B", "text": "đấu tranh bảo vệ chủ quyền biển, đảo."}, {"key": "C", "text": "chiến tranh bảo vệ biên giới phía Bắc."}, {"key": "D", "text": "đấu tranh bảo vệ chủ quyền biên giới Đông Nam."}], "answer": "C", "basis": "file", "explanation": "Trong đề cương, nhận định về nghệ thuật “lấy nhỏ đánh lớn, lấy ít địch nhiều” được gắn với chiến tranh bảo vệ biên giới phía Bắc.", "note": "", "passage": [], "promptTail": ""}, {"id": 25, "lesson": 1, "number": 25, "type": "mcq", "topic": "lesson1", "stem": "Việt Nam có quyền chủ quyền và quyền tài phán đối với", "options": [{"key": "A", "text": "vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế và thềm lục địa Việt Nam."}, {"key": "B", "text": "vùng thềm lục địa Việt Nam."}, {"key": "C", "text": "vùng tiếp giáp lãnh hải, vùng nước lợ gần biển."}, {"key": "D", "text": "vùng đặc quyền kinh tế thuộc các tỉnh phía Nam."}], "answer": "A", "basis": "file", "explanation": "Phương án A liệt kê đầy đủ nhất các vùng được hỏi theo đề. Khi học pháp lí biển, cần phân biệt chế độ của vùng tiếp giáp với vùng đặc quyền kinh tế và thềm lục địa; không hiểu các quyền ở ba vùng là giống nhau.", "note": "Các quyền ở từng vùng biển có nội dung, phạm vi khác nhau.", "passage": [], "promptTail": ""}, {"id": 26, "lesson": 1, "number": 26, "type": "mcq", "topic": "lesson1", "stem": "Nhân ngày Thương binh – Liệt sĩ 27/7, người dân thường dâng hương, dâng hoa cho các anh hùng liệt sĩ tại nghĩa trang liệt sĩ ở địa phương. Đây là hành động", "options": [{"key": "A", "text": "tri ân với người có công với đất nước."}, {"key": "B", "text": "sẵn sàng tham gia bảo vệ vững chắc độc lập, chủ quyền của Tổ quốc."}, {"key": "C", "text": "học tập, tìm hiểu đường lối, chủ trương của Đảng."}, {"key": "D", "text": "phụng dưỡng bà mẹ Việt Nam anh hùng."}], "ans function own(o,k){return Object.prototype.hasOwnProperty.call(o||{},k)}
function cleanAnswers(raw,q){const a={};if(!raw||typeof raw!=='object')return a;if(q.type==='mcq'){if('ABCD'.includes(raw.choice)&&typeof raw.choice==='string'&&raw.choice.length===1)a.choice=raw.choice;}else for(const s of q.statements)if(typeof raw[s.key]==='boolean')a[s.key]=raw[s.key];return a;}
function cleanSession(raw){if(!raw||!Array.isArray(raw.ids)||raw.ids.length<1||raw.ids.length>DATA.length||!['practice','exam'].includes(raw.mode))throw Error('Dữ liệu không hợp lệ');if(raw.mode==='exam'&&(!Number.isFinite(raw.expires)||raw.expires<=0))throw Error('Dữ liệu không hợp lệ');const ids=raw.ids.map(Number);if(new Set(ids).size!==ids.length||ids.some(id=>!BY_ID[id]))throw Error('Dữ liệu không hợp lệ');const s={id:String(raw.id||'imported').slice(0,100),ids,mode:raw.mode,started:Number(raw.started)||Date.now(),expires:raw.mode==='exam'&&Number.isFinite(raw.expires)?raw.expires:null,ended:typeof raw.ended==='number'?raw.ended:null,finished:!!raw.finished,answers:{},keyMap:{},order:{},checked:{},recorded:{},index:Math.min(ids.length-1,Math.max(0,Math.floor(Number(raw.index)||0))),keyMode:raw.keyMode==='review'?'review':'source'};
for(const id of ids){const q=BY_ID[id];s.answers[id]=cleanAnswers(raw.answers?.[id],q);s.keyMap[id]=cleanAnswers(raw.keyMap?.[id],q);const ac=raw.keyMap?.[id]?.accepted;if(Array.isArray(ac)&&ac.length>0&&ac.length<=4&&ac.every(x=>typeof x==='string'&&x.length===1&&'ABCD'.includes(x)))s.keyMap[id].accepted=[...new Set(ac)];if(q.type==='mcq'&&!s.keyMap[id].choice)throw Error('Dữ liệu không hợp lệ');if(q.type==='tf'&&q.statements.some(a=>typeof s.keyMap[id][a.key]!=='boolean'))throw Error('Dữ liệu không hợp lệ');const order=raw.order?.[id];s.order[id]=Array.isArray(order)&&order.length===4&&new Set(order).size===4&&order.every(x=>'ABCD'.includes(x)&&typeof x==='string'&&x.length===1)?order.slice():['A','B','C','D'];s.checked[id]=!!raw.checked?.[id];s.recorded[id]=!!raw.recorded?.[id];}return s;}
function cleanState(raw){if(!raw||raw.version!==1||raw.subject!=='gdqp12-midterm2026')throw Error('Dữ liệu không hợp lệ');const n=fresh();const c=raw.config||{};n.config.topic=['all','lesson1','lesson2'].includes(c.topic)?c.topic:'all';n.config.type=['all','mcq'].includes(c.type)?c.type:'all';n.config.count=['all','10','20','30'].includes(String(c.count))?String(c.count):'all';n.config.minutes=[15,30,45,60].includes(Number(c.minutes))?Number(c.minutes):30;n.config.shuffleQ=!!c.shuffleQ;n.config.shuffleO=!!c.shuffleO;n.keyMode=raw.keyMode==='review'?'review':'source';n.bookmarks=Array.isArray(raw.bookmarks)?[...new Set(raw.bookmarks.map(Number).filter(x=>BY_ID[x]))]:[];

if(raw.session)n.session=cleanSession(raw.session);if(Array.isArray(raw.history))n.history=raw.history.slice(0,20).map(x=>{try{const s=cleanSession(x);return s.finished?s:null}catch{return null}}).filter(Boolean);return n;}

function home(){const studied=DATA.filter(q=>state.stats[q.id]?.attempts>0).length,mastered=DATA.filter(q=>state.stats[q.id]?.attempts>0&&state.stats[q.id].correct===1).length;return '<section class="hero"><div><div class="eyebrow">GDQP & AN 12 · GIỮA KÌ I 2026–2027</div><h1>Ôn Quốc phòng,<br>nhớ chắc từng bài.</h1><p>60 câu trong đề cương của Nhân, chia đúng 2 bài. Luyện từng câu, đọc giải thích và quay lại những chỗ còn nhầm.</p><div class="row"><button class="btn light" data-nav="practice">Bắt đầu luyện tập '+icon('arrow')+'</button><button class="btn gold" data-nav="exam">Làm bài kiểm tra</button></div></div><div class="hero-art" aria-hidden="true"><div class="book"><div>12<small>GDQP & AN</small></div></div></div></section>'+(state.session&&!state.session.finished?'<div class="note-box neutral mt row between"><span><b>Bài đang làm</b> · '+(state.session.mode==='exam'?'Kiểm tra':'Luyện tập')+' · '+totals(state.session).answered+'/'+state.session.ids.length+' câu đã chọn</span><button class="btn small" data-action="resume">Tiếp tục '+icon('right')+'</button></div>':'')+'<div class="stats"><div class="stat"><div class="stat-top">Câu trong đề cương '+icon('book')+'</div><strong>60</strong><small>2 bài · Mỗi bài 30 câu</small></div><div class="stat"><div class="stat-top">Đã ôn '+icon('chart')+'</div><strong>'+studied+'<span class="fine"> / 60</span></strong><small>Tính khi kiểm tra hoặc nộp bài</small></div><div class="stat"><div class="stat-top">Đúng ở lần gần nhất '+icon('check')+'</div><strong>'+mastered+'</strong><small>Theo nguồn đáp án của bài làm</small></div><div class="stat"><div class="stat-top">Cần ôn lại '+icon('refresh')+'</div><strong>'+getWrong().length+'</strong><small>Câu sai hoặc còn bỏ trống</small></div></div><div class="section-head"><div><h2>Chọn bài để ôn</h2><p class="sub">Giữ đúng số câu của từng bài trong tài liệu.</p></div><button class="btn ghost small" data-nav="notebook">Mở sổ tay '+icon('right')+'</button></div><div class="grid3 lesson function startSession(customIds=null,mode='practice'){let ids=customIds?customIds.filter(x=>BY_ID[x]):DATA.filter(q=>(state.config.topic==='all'||q.topic===state.config.topic)&&(state.config.type==='all'||q.type===state.config.type)).map(q=>q.id);if(state.config.shuffleQ)ids=shuffled(ids);if(!customIds&&state.config.count!=='all')ids=ids.slice(0,Number(state.config.count));if(!ids.length){toast('Chưa có câu phù hợp để làm.');return;}const s={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),ids,mode,started:Date.now(),expires:mode==='exam'?Date.now()+state.config.minutes*60000:null,ended:null,finished:false,answers:{},keyMap:{},order:{},checked:{},recorded:{},index:0,keyMode:state.keyMode};for(const id of ids){const q=BY_ID[id];s.answers[id]={};s.keyMap[id]=effectiveKey(q);s.order[id]=state.config.shuffleO?shuffled(['A','B','C','D']):['A','B','C','D'];}state.session=s;quizIndex=0;save();navigate('quiz');}
function displayChoice(s,q,key){if(!key)return 'Chưa chọn';const pos=s.order[q.id].indexOf(key);const t=q.options.find(x=>x.key===key);return String.fromCharCode(65+pos)+'. '+(t?.text||'');}
function qFeedback(q,s){const g=grade(q,s.answers[q.id],s.keyMap[q.id]),k=s.keyMap[q.id],accepted=k.accepted||[k.choice];const body='<h4>'+icon(g.correct?'check':'alert')+' '+(g.correct?'Khớp đáp án đang dùng':'Đáp án cần nhớ')+'</h4><p><b>'+accepted.map(key=>esc(displayChoice(s,q,key))).join('<br>hoặc ')+'</b></p><p>'+esc(q.explanation)+'</p>';return '<div class="feedback '+(g.correct<g.total?'bad':'')+'">'+body+'<p class="fine">'+esc(keyBasis(q))+' · Nguồn bài: '+(s.keyMode==='review'?'Rà soát có lưu ý':'Theo đề cương')+'. Đáp án bạn chỉnh riêng được ưu tiên; lời giải vẫn đối chiếu nội dung gốc.</p></div>';}
function quiz(){const s=state.session;if(!s){view='practice';return setup();}if(s.finished){activeResult=s;view='results';return results();}quizIndex=Math.max(0,Math.min(quizIndex,s.ids.length-1));const q=BY_ID[s.ids[quizIndex]],a=s.answers[q.id]||{},reveal=!!s.checked[q.id]&&s.mode==='practice',g=grade(q,a,s.keyMap[q.id]),all=totals(s);return '<div class="quiz-top"><div><div class="eyebrow">'+(s.mode==='exam'?'BÀI KIỂM TRA':'PHÒNG LUYỆN TẬP')+'</div><span class="pill">'+TOPICS[q.topic].title+'</span> <span class="pill gray">'+(q.type==='mcq'?'Chọn 1 đáp án':'Đúng – Sai')+'</span></div><div class="timer" id="timer">'+icon('clock')+'<span id="timer-text">'+(s.mode==='exam'?fmtTime(s.expires-Date.now()):'Không giới hạn')+'</span></div></div><div class="quiz-layout"><div><div class="row between fine"><span>Vị trí '+(quizIndex+1)+' / '+s.ids.length+'</span><span>'+all.answered+' / '+all.total+' câu đã chọn</span></div><div class="quiz-progress"><div style="width:'+Math.round(all.answered/all.total*100)+'%"></div></div><article class="panel"><div class="question-head"><span class="question-label">'+qlabel(q)+' <span class="fine">· số gốc</span></span><div class="row">'+(q.note?'<span class="pill warn" title="Có ghi chú sau khi xem lời giải">Cần lưu ý</span>':'')+'<button class="icon-btn '+(state.bookmarks.includes(q.id)?'on':'')+'" data-bookmark="'+q.id+'" aria-label="'+(state.bookmarks.includes(q.id)?'Bỏ đánh dấu':'Đánh dấu câu khó')+'" aria-pressed="'+state.bookmarks.includes(q.id)+'">'+icon('bookmark')+'</button></div></div><h1 class="question-text">'+esc(q.stem)+'</h1>'+source(q)+(q.type==='mcq'?'<div class="options" role="group" aria-label="Các phương án">'+s.order[q.id].map((key,i)=>{const opt=q.options.find(x=>x.key===key),selected=a.choice===key,correct=(s.keyMap[q.id].accepted||[s.keyMap[q.id].choice]).includes(key);return '<button class="option '+(selected?'selected ':'')+(reveal&&correct?'correct ':reveal&&selected?'wrong ':'')+'" data-choice="'+key+'" aria-pressed="'+selected+'"'+(reveal?' disabled':'')+'><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(opt.text)+'</span>'+(reveal&&(correct||selected)?'<span class="answer-status">'+(correct?'Đáp án đúng':'Bạn chọn')+'</span>':'')+'</button>';}).join('')+'</div>':'<div class="tf-list">'+q.statements.map(st=>{const val=a[st.key],key=s.keyMap[q.id][st.key];return '<div class="tf-item"><div class="tf-statement"><b>'+st.key+')</b> '+esc(st.text)+'</div><div class="tf-picks" role="group" aria-label="Ý '+st.key+'">'+[true,false].map(v=>'<button class="tf-pick '+(val===v?'selected ':'')+(reveal&&key===v?'correct ':reveal&&val===v?'wrong ':'')+'" data-tf="'+st.key+'" data-value="'+v+'" aria-pressed="'+(val===v)+'"'+(reveal?' disabled':'')+'>'+(v?'Đúng':'Sai')+'</button>').join('')+(reveal?'<span class="fine '+(val!==key?'error':'')+'">'+(val===key?'✓ Đúng ý':'× Chưa đúng')+'</span>':'')+'</div>'+(reveal?'<div class="tf-explanation"><b>Đáp án: '+(key?'Đúng':'Sai')+'.</b> '+esc(st.explanation)+'</div>':'')+'</div>';}).join('')+'</div>')+(reveal?qFeedback(q,s)+(q.note?'<div class="note-box mt">'+esc(q.note)+'</div>':''):'')+'<div id="answer-hint" class="fine error mt" role="status"></div><div class="quiz-bottom"><button class="btn ghost" data-action="prev"'+(quizIndex===0?' disabled':'')+'>'+icon('left')+' Trước</button>'+(s.mode==='practice'&&!reveal?'<button class="btn" data-action="check">Kiểm tra '+icon('check')+'</button>':'')+(quizIndex<s.ids.length-1?'<button class="btn '+(s.mode==='exam'||reveal?'':'pale')+'" data-action="next">Tiếp '+icon('right')+'</button>':'<button class="btn" data-action="finish">Nộp bài '+icon('check')+'</button>')+'</div><div class="notes"><label for="question-note">Ghi chú riêng của bạn</label><textarea id="question-note" data-note="'+q.id+'" maxlength="3000" placeholder="Từ khóa dễ nhầm, mẹo ghi nhớ…">'+esc(state.notes[q.id]||'')+'</textarea><div class="fine">Tự lưu trên thiết bị này.</div></div></article></div><aside class="quiz-tools"><div class="panel nav-panel"><h3>Phiếu trả lời</h3><p class="fine">Bấm số để chuyển câu.</p><div class="question-grid">'+s.ids.map((id,i)=>{const g=grade(BY_ID[id],s.answers[id],s.keyMap[id]);const cls=s.checked[id]&&s.mode==='practice'?(g.correct===g.total?'good':'bad'):g.answered===g.total?'done':'';return '<button class="qdot '+cls+' '+(i===quizIndex?'current ':'')+(state.bookmarks.includes(id)?'star':'')+'" data-jump="'+i+'" aria-label="'+qlabel(BY_ID[id])+', '+g.answered+'/'+g.total+' câu đã chọn"'+(i===quizIndex?' aria-current="step"':'')+'>'+qcode(BY_ID[id])+'</button>';}).join('')+'</div><div class="legend"><span><i></i>Đã chọn đủ</span><span><i class="blank"></i>Chưa đủ</span>'+(s.mode==='practice'?'<span><i class="bad"></i>Cần ôn</span>':'')+'</div><div class="divider"></div><button class="btn wide" data-action="finish">'+icon('check')+' Nộp bài</button><button class="btn ghost small wide mt" data-nav="home">Về tổng quan · giữ bài</button><p class="fine">Đã tự lưu. Nguồn đáp án được giữ cố định khi bắt đầu bài này.</p></div></aside></div>';}
function record(s,id){if(s.recorded[id])return;const g=grade(BY_ID[id],s.answers[id],s.keyMap[id]);state.stats[id]={attempts:(state.stats[id]?.attempts||0)+1,correct:g.correct,total:g.total,updated:Date.now()};s.recorded[id]=true;}
function checkQuestion(){const s=state.session,q=BY_ID[s.ids[quizIndex]];if(s.finished||s.mode!=='practice'||s.checked[q.id])return;const g=grade(q,s.answers[q.id],s.keyMap[q.id]);if(g.answered<g.total){$('answer-hint').textContent=q.type==='tf'?'Bạn cần chọn Đúng hoặc Sai cho đủ cả 4 ý.':'Bạn hãy chọn một phương án trước.';return;}s.checked[q.id]=true;record(s,q.id);save();render();}
function requestFinish(){const s=state.session;if(!s||s.finished)return;const g=totals(s),left=g.total-g.answered;modal('Nộp bài ôn tập?',left?'Còn '+left+' câu chưa trả lời. Những câu bỏ trống được tính là chưa đúng trong tỉ lệ ôn tập.':'Bạn đã chọn đủ '+g.total+' câu. Nộp bài để xem kết quả và lời giải.',()=>finishSession(false),'Nộp bài');}
function finishSession(auto=false){const s=state.session;if(!s||s.finished)return;s.finished=true;s.ended=Date.now();for(const id of s.ids)record(s,id);state.history.unshift(JSON.parse(JSON.stringify(s)));state.history=state.history.slice(0,20);save();activeResult=s;resultFilter='all';view='results';closeModal();render();if(auto)toast('Đã hết thời gian. Bài của bạn đã được nộp.');window.scrollTo({top:0,behavior:'instant'});}
function resultCard(q,s){const a=s.answers[q.id]||{},g=grade(q,a,s.keyMap[q.id]);return '<details class="review-card"><summary><span class="pill '+(g.correct===g.total?'':'red')+'">'+g.correct+'/'+g.total+'</span><span class="snippet">'+qlabel(q)+' · '+esc(q.stem)+'</span><span class="muted">⌄</span></summary><div class="review-body">'+(q.type==='mcq'?source(q)+'<p class="choice-line">Bạn chọn: '+esc(displayChoice(s,q,a.choice))+'</p>':source(q)+q.statements.map(st=>'<div class="tf-explanation"><b>'+st.key+')</b> '+esc(st.text)+'<p class="choice-line">Bạn chọn: '+(typeof a[st.key]==='boolean'?(a[st.key]?'Đúng':'Sai'):'Chưa chọn')+' · <b>Đáp án: '+(s.keyMap[q.id][st.key]?'Đúng':'Sai')+'</b></p><p>'+esc(st.explanation)+'</p></div>').join(''))+qFeedback(q,s)+'<div class="row mt"><button class="btn ghost small" data-bookmark="'+q.id+'">'+icon('bookmark')+' '+(state.bookmarks.includes(q.id)?'Bỏ đánh dấu':'Đánh dấu câu')+'</button></div></div></details>';}
function results(){const s=activeResult||state.session;if(!s)return title('Chưa có kết quả','Bắt đầu một bài luyện tập hoặc kiểm tra trước nhé.');const g=totals(s),wrong=s.ids.filter(id=>{const t=grade(BY_ID[id],s.answers[id],s.keyMap[id]);return t.correct<t.total;});const ids=s.ids.filter(id=>{const a=grade(BY_ID[id],s.answers[id],s.keyMap[id]);return resultFilter==='all'||resultFilter==='wrong'&&a.correct<a.total||resultFilter==='blank'&&a.answered<a.total;});return '<div class="result-hero"><div><div class="eyebrow" style="color:#b8d7c2">'+(s.mode==='exam'?'BÀI KIỂM TRA':'BÀI LUYỆN TẬP')+' · ĐÃ HOÀN THÀNH</div><h1>'+g.correct+'/'+g.total+' câu trả lời đúng</h1><p class="sub">'+(g.total-g.answered)+' câu bỏ trống · '+s.ids.length+' câu · '+date(s.ended||Date.now())+'</p><div class="row">'+(wrong.length?'<button class="btn light" data-action="retry-result">Ôn lại '+wrong.length+' câu cần nhớ</button>':'')+'<button class="btn gold" data-nav="practice">Làm bài mới</button></div></div><div class="score-circle"><strong>'+Math.round(g.correct/g.total*100)+'%</strong><small>TỈ LỆ ĐÚNG</small></div></div><div class="note-box neutral mb">Mỗi câu trắc nghiệm tính là 1 lượt trả lời. Tỉ lệ này phục vụ ôn tập, không thay cho điểm thi chính thức. Nguồn chấm được giữ theo lúc bắt đầu bài.</div><div class="section-head"><div><h2>Xem lại và hiểu vì sao</h2><p class="sub">Mở từng câu để xem đáp án, tư liệu và giải thích.</p></div><button class="btn ghost small" data-action="export-result">'+icon('download')+' Lưu kết quả</button></div><div class="filters">'+[['all','Tất cả ('+s.ids.length+')'],['wrong','Cần ôn ('+wrong.length+')'],['blank','Có bỏ trống']].map(([k,t])=>'<button class="filter '+(resultFilter===k?'active':'')+'" data-result-filter="'+k+'">'+t+'</button>').join('')+'</div><div class="results">'+(ids.length?ids.map(id=>resultCard(BY_ID[id],s)).join(''):'<div class="panel empty">Không có câu trong nhóm này.</div>')+'</div>';}
function bank(){const wrong=getWrong();let qs=bankMode==='saved'?DATA.filter(q=>state.bookmarks.includes(q.id)):wrong;qs=qs.filter(q=>(bankTopic==='all'||q.topic===bankTopic)&&(!searchText||normalize(qlabel(q)+' '+q.stem+' '+q.id+' '+q.options?.map(x=>x.text).join(' ')+' '+q.statements?.map(x=>x.text).join(' ')).includes(normalize(searchText))));return title('Giữ lại những câu cần nhớ','Câu sai tự cập nhật sau mỗi lần kiểm tra. Câu đánh dấu do bạn chọn.')+'<div class="row between"><div class="filters">'+[['wrong','Cần ôn lại ('+wrong.length+')'],['saved','Đã đánh dấu ('+state.bookmarks.length+')']].map(([k,t])=>'<button class="filter '+(bankMode===k?'active':'')+'" data-bank-mode="'+k+'">'+t+'</button>').join('')+'</div><button class="btn small" data-action="start-bank"'+(!qs.length?' disabled':'')+'>Ôn '+qs.length+' câu '+icon('arrow')+'</button></div><div class="row mb"><label class="sr" for="bank-search">Tìm câu hỏi</label><input id="bank-search" class="search" style="flex:1;min-width:170px" placeholder="Tìm nội dung hoặc số câu…" value="'+esc(searchText)+'"><label class="sr" for="bank-topic">Lọc chủ đề</label><select class="keyselect" id="bank-topic" style="width:auto"><option value="all">Mọi chủ đề</option>'+Object.entries(TOPICS).map(([k,t])=>'<option value="'+k+'"'+(bankTopic===k?' selected':'')+'>'+t.title+'</option>').join('')+'</select></div><div class="panel">'+(qs.length?qs.map(q=>'<div class="list-row"><div><span class="fine">'+qlabel(q)+' · '+TOPICS[q.topic].title+'</span><div>'+esc(q.stem)+'</div>'+(state.notes[q.id]?'<div class="fine">Ghi chú: '+esc(state.notes[q.id])+'</div>':'')+'</div><button class="icon-btn '+(state.bookmarks.includes(q.id)?'on':'')+'" data-bookmark="'+q.id+'" aria-label="Đánh dấu '+qlabel(q)+'" aria-pressed="'+state.bookmarks.includes(q.id)+'">'+icon('bookmark')+'</button></div>').join(''):'<div class="empty">'+icon('bookmark')+'<h3>'+((bankMode==='wrong'&&!searchText&&bankTopic==='all')?'Chưa có câu cần ôn lại':'Chưa có câu trong nhóm này')+'</h3><p>Làm bài hoặc bấm đánh dấu ở đầu câu hỏi để lưu vào đây.</p><button class="btn pale small" data-nav="practice">Đến luyện tập</button></div>')+'</div>';}
function normalize(t){return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();}
function bankIds(){return (bankMode==='saved'?DATA.filter(q=>state.bookmarks.includes(q.id)):getWrong()).filter(q=>(bankTopic==='all'||q.topic===bankTopic)&&(!searchText||normalize(qlabel(q)+' '+q.stem+' '+q.id+' '+q.options?.map(x=>x.text).join(' ')+' '+q.statements?.map(x=>x.text).join(' ')).includes(normalize(searchText)))).map(q=>q.id);}
function historyPage(){return title('Lịch sử học của bạn','Giữ 20 bài đã nộp gần nhất trên trình duyệt này.')+'<div class="panel">'+(state.history.length?state.history.map((s,i)=>{const g=totals(s);return '<div class="list-row"><div><b>'+(s.mode==='exam'?'Kiểm tra':'Luyện tập')+'</b> · '+s.ids.length+' câu<div class="fine">'+date(s.ended)+' · '+g.correct+'/'+g.total+' câu đúng</div></div><div class="row"><span class="pill">'+Math.round(g.correct/g.total*100)+'%</span><button class="btn ghost small" data-history="'+i+'">Xem lại</button></div></div>';}).join(''):'<div class="empty">'+icon('history')+'<h3>Trang đầu của hành trình ôn tập</h3><p>Nộp một bài để lưu kết quả và lời giải ở đây.</p><button class="btn" data-nav="practice">Bắt đầu luyện tập</button></div>')+'</div>';}
function notebook(){return title('Sổ tay trước giờ kiểm tra','Ghi nhớ mốc chính, phân biệt thuật ngữ và xem các câu cần trao đổi với giáo viên.')+'<div class="grid3"><article class="panel study-card"><div class="topic-icon">'+icon('compass')+'</div><h3>Bài 1 · Các mốc dễ nhầm</h3><div class="timeline">'+[['3/5/1975','Quân Pol Pot tiến công đảo Phú Quốc; câu 3 có hai mốc “trước” cùng phù hợp.'],['2/12/1978','Mặt trận Đoàn kết dân tộc cứu nước Campuchia ra đời.'],['7/1/1979','Phnom Penh được giải phóng.'],['17/2/1979','Mở cuộc tiến công quy mô lớn ở biên giới phía Bắc.'],['5/3/1979','Chủ tịch nước Tôn Đức Thắng kí Sắc lệnh 29-LCT tổng động viên.']].map(([d,t])=>'<div class="timeline-item"><b>'+d+'</b>'+t+'</div>').join('')+'</div><button class="btn pale small" data-topic-start="lesson1">Ôn Bài 1 '+icon('right')+'</button></article><article class="panel study-card"><div class="topic-icon">'+icon('layers')+'</div><h3>Bài 2 · Phân biệt cho chắc</h3><div class="table-scroll"><table><thead><tr><th>Khái niệm</th><th>Từ khóa</th></tr></thead><tbody><tr><td>Quân khu</td><td>Tổ chức quân sự theo lãnh thổ</td></tr><tr><td>Quân đoàn</td><td>Đơn vị tác chiến chiến dịch / chiến dịch – chiến thuật</td></tr><tr><td>Quân chủng</td><td>Môi trường địa lí hoạt động</td></tr><tr><td>Binh chủng</td><td>Chuyên môn, trang bị và cách tổ chức đặc thù</td></tr><tr><td>Bộ Tổng Tham mưu</td><td>Sẵn sàng chiến đấu; điều hành hoạt động quân sự</td></tr><tr><td>Tổng cục Chính trị</td><td>Công tác Đảng, công tác chính trị</td></tr></tbody></table></div><p class="fine mt">Bài 2 câu 11: file tô đỏ A nhưng nội dung định nghĩa quân đoàn phù hợp B.</p><button class="btn pale small" data-topic-start="lesson2">Ôn Bài 2 '+icon('right')+'</button></article><article class="panel study-card"><div class="topic-icon">'+icon('star')+'</div><h3>Cấp bậc & từ khóa</h3><ul class="read-list"><li><b>Sĩ quan quân đội:</b> 3 cấp, 12 bậc.</li><li><b>Sĩ quan nghiệp vụ công an:</b> 3 cấp, 12 bậc.</li><li><b>Cấp úy:</b> Thiếu → Trung → Thượng → Đại; 4 bậc.</li><li><b>Chuyên môn kĩ thuật CAND:</b> cấp tá 3 bậc, cấp úy 4 bậc, hạ sĩ quan 3 bậc.</li><li><b>Ba sao, hai gạch:</b> Thượng tá, trong ngữ cảnh câu hỏi của đề.</li><li><b>“Không đúng”, “không bao gồm”:</b> tìm phương án loại trừ.</li><li><b>“Số phát biểu không đúng”:</b> đếm số ý sai, không đếm ý đúng.</li></ul><p class="fine">Ở câu về thuật ngữ, đọc đúng nguyên văn để tránh nhầm “quân hiệu” với “Quốc hiệu”.</p></article></div><div class="panel mt"><h3>Đối chiếu tài liệu trước khi ghi nhớ</h3><p class="sub">Giữ nguyên đáp án tô đỏ để ôn theo file; phần rà soát và ghi chú giúp bạn nhận ra chỗ có thể nhầm.</p><div class="table-scroll"><table><thead><tr><th>Vị trí</th><th>Điểm cần lưu ý</th></tr></thead><tbody>'+DATA.filter(q=>q.note).map(q=>'<tr><td>'+qlabel(q)+'</td><td>'+esc(q.note)+'</td></tr>').join('')+'</tbody></table></div><div class="note-box neutral mt">Tên cơ quan hậu cần, kĩ thuật và công an trong một số phương án phản ánh mô hình tổ chức cũ. Không coi nguyên danh sách của đề là sơ đồ hiện hành.</div></div><div class="panel mt"><h3>Nguồn đối chiếu cho phần lưu ý</h3><p class="fine">Nguồn chính: ĐC KTGKI QP K12 2026-2027.docx do bạn cung cấp. Các giải thích là nội dung hỗ trợ ôn tập.</p><ul class="read-list"><li><a href="https://baochinhphu.vn/phat-bieu-cua-thu-tuong-tai-le-ky-niem-40-nam-con-duong-cuu-nuoc-cua-thu-tuong-campuchia-hun-sen-102223328.htm" target="_blank" rel="noopener noreferrer">Báo Chính phủ · Mốc Phú Quốc, Mặt trận Campuchia và Phnom Penh</a></li><li><a href="https://www.mod.gov.vn/vn/noi-dung/sa-mod-qlcd-hcc/sa-qlnnvqp-cchc/ban-giao-cac-co-quan-don-vi-thuoc-tong-cuc--hau-can-tong-cuc-ky-thuat-ve-tong-cuc-hau-can-ky-thuat" target="_blank" rel="noopener noreferrer">Bộ Quốc phòng · Sáp nhập Tổng cục Hậu cần – Kỹ thuật</a></li><li><a href="https://tiengchuong.chinhphu.vn/giam-6-tong-cuc-gan-60-don-vi-cap-cuc-va-gan-300-don-vi-cap-phong-11324424.htm" target="_blank" rel="noopener noreferrer">Cổng Chính phủ · Bộ Công an không tổ chức cấp Tổng cục</a></li><li><a href="https://xaydungchinhsach.chinhphu.vn/bai-bo-nghi-dinh-quy-dinh-cap-bac-ham-si-quan-ha-si-quan-cong-an-nhan-dan-119231221130546795.htm" target="_blank" rel="noopener noreferrer">Cổng Chính phủ · Phân biệt hệ thống cấp bậc hàm</a></li><li><a href="https://www.qdnd.vn/tu-lieu-ho-so/ho-so/vuot-nui-bang-rung-danh-manh-tien-nhanh-lap-cong-vang-doi-bai-1-quyet-dinh-chien-luoc-va-muc-tieu-xuyen-suot-734967" target="_blank" rel="noopener noreferrer">Báo Quân đội nhân dân · Quân đoàn và binh đoàn chiến dịch</a></li><li><a href="https://www.mod.gov.vn/vn/chi-tiet/sa-ttsk/sa-tt-qpan/tiep-tuc-giu-vung-va-tang-cuong-su-lanh-dao-tuyet-doi-truc-tiep-ve-moi-mat-cua-dang-doi-voi-quan-doi" target="_blank" rel="noopener noreferrer">Bộ Quốc phòng · Nguyên tắc lãnh đạo của Đảng</a></li></ul><p class="fine">Rà soát ngày 20/10/2026. Chức năng học hoạt động offline; chỉ các liên kết nguồn cần mạng.</p></div>';}
function keyEditorRow(q){const custom=state.overrides[q.id]||{};const selects=q.type==='mcq'?'<select class="keyselect" data-key-id="'+q.id+'" data-key-unit="choice" aria-label="Đáp án '+qlabel(q)+'"><option value="">Mặc định · file: '+q.answer+'</option>'+q.options.map(o=>'<option value="'+o.key+'"'+(custom.choice===o.key?' selected':'')+'>'+o.key+'. '+esc(o.text)+'</option>').join('')+'</select>':'<div class="tf-edit">'+q.statements.map(s=>'<label>'+s.key+')<select class="keyselect" data-key-id="'+q.id+'" data-key-unit="'+s.key+'" aria-label="Đáp án câu '+q.id+' ý '+s.key+'"><option value="">Mặc định</option><option value="true"'+(custom[s.key]===true?' selected':'')+'>Đúng</option><option value="false"'+(custom[s.key]===false?' selected':'')+'>Sai</option></select></label>').join('')+'</div>';return '<div class="key-row"><b>'+qlabel(q)+'</b><div>'+selects+'<div class="fine">'+(q.type==='tf'?'Mặc định theo nguồn chấm đã chọn. ':'Phương án A–D theo thứ tự gốc trong Word. ')+(q.basis==='added'?'Đáp án bổ sung. ':'')+esc(q.note)+'</div></div></div>';}
function settings(){return title('Cài đặt & dữ liệu của bạn','Chọn nguồn chấm, chỉnh đáp án theo giáo viên và giữ một bản sao tiến độ.')+'<div class="setting-grid"><section class="panel"><h3>Nguồn đáp án</h3><p class="fine">Mỗi câu có một phương án tô đỏ trong Word. Trang mặc định dùng đúng phương án đó; các ghi chú giúp nhận ra câu cần đối chiếu.</p><label class="radio-card"><input type="radio" name="keyMode" value="source"'+(state.keyMode==='source'?' checked':'')+'><b>Theo đáp án tô đỏ trong file</b><small>Giữ đủ 60 câu và đáp án nguồn. Các câu có dấu hiệu nhầm vẫn được gắn lưu ý khi xem lời giải.</small></label><label class="radio-card"><input type="radio" name="keyMode" value="review"'+(state.keyMode==='review'?' checked':'')+'><b>Rà soát các câu có lưu ý</b><small>Bài 1 câu 3: chấp nhận A hoặc C. Bài 2 câu 11: chọn B; câu 21: ưu tiên A. Các câu khác giữ theo file; không tự chốt lại câu còn tranh luận.</small></label><div class="note-box mt">Thay đổi chỉ áp dụng cho bài bắt đầu sau đó. Bài đang làm và lịch sử giữ nguồn chấm lúc tạo bài. Các đáp án chỉnh riêng được ưu tiên.</div></section><section class="panel"><h3>Sao lưu tiến độ</h3><p class="sub">Lưu bài đang làm, lịch sử, câu đánh dấu, ghi chú và đáp án chỉnh riêng vào file JSON.</p><div class="row"><button class="btn" data-action="export">'+icon('download')+' Xuất sao lưu</button><button class="btn ghost" data-action="import">'+icon('upload')+' Nhập sao lưu</button></div><p class="fine mt">Tiến độ Quốc phòng lưu riêng với Lịch sử. Chỉ nhập bản sao lưu xuất từ trang Quốc phòng này.</p><p class="fine">Chuyển trình duyệt, đổi tên/vị trí file HTML hoặc xóa dữ liệu trình duyệt có thể làm mất bản lưu. Dùng sao lưu để chuyển thiết bị.</p><div class="divider"></div><h4>Cách mở trang</h4><ol class="read-list"><li>Tải file HTML về máy.</li><li>Trên máy tính, nhấp đúp để mở bằng Chrome, Edge hoặc Firefox.</li><li>Trên điện thoại, dùng ứng dụng hỗ trợ mở HTML với JavaScript. Bản xem trước trong ứng dụng Tệp có thể không chạy đầy đủ.</li></ol><p class="fine">Không dùng CDN, không cần tải thư viện. Có thể ngắt mạng khi học.</p></section></div><section class="panel mt"><details><summary style="cursor:pointer;font-weight:700">Chỉnh đáp án theo giáo viên · A–D theo thứ tự gốc</summary><p class="fine">Để “Mặc định” nếu chưa xác nhận. Chọn một đáp án riêng sẽ thay nguồn chấm, kể cả các câu có hai phương án được chấp nhận ở chế độ rà soát.</p><p class="fine">Lời giải vẫn diễn giải nội dung gốc. Hãy ghi thêm hướng dẫn của giáo viên ở ghi chú riêng nếu cần.</p><div class="key-editor">'+DATA.map(keyEditorRow).join('')+'</div><button class="btn ghost small mt" data-action="reset-keys">Bỏ toàn bộ đáp án chỉnh riêng</button></details></section><section class="panel mt"><h3>Xóa dữ liệu Quốc phòng trên thiết bị</h3><p class="sub">Xóa bài đang làm, tiến độ, ghi chú và cài đặt của trang này. Hãy xuất bản sao nếu muốn giữ lại.</p><button class="btn danger small" data-action="reset">Xóa dữ liệu của trang</button></section>';}
function modal(head,msg,fn,label='Xác nhận'){modalReturnFocus=document.activeElement;$('modal-root').innerHTML='<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading" aria-describedby="modal-description"><h2 id="modal-heading">'+esc(head)+'</h2><p id="modal-description">'+esc(msg)+'</p><div class="row"><button class="btn ghost" id="modal-cancel">Quay lại</button><button class="btn" id="modal-ok">'+esc(label)+'</button></div></div></div>';$('modal-cancel').onclick=closeModal;$('modal-ok').onclick=()=>{closeModal();fn();};$('modal-cancel').focus();}
function closeModal(){const wasOpen=!!$('modal-root').innerHTML;$('modal-root').innerHTML='';if(wasOpen&&modalReturnFocus?.isConnected)modalReturnFocus.focus();}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportResult(){const s=activeResult||state.session;if(!s?.finished)return;const g=totals(s);const payload={de:'GDQP & AN 12 giữa kì I · 2026–2027',ten:'Trần Đắc Nhân',lop:'12A1',thoiGian:new Date(s.ended).toISOString(),nguon:s.keyMode,tyLeDung:g.correct/g.total,soYDung:g.correct,tongSoY:g.total,boTrong:g.total-g.answered,chiTiet:s.ids.map(id=>({bai:BY_ID[id].lesson,cau:BY_ID[id].number,noiDung:BY_ID[id].stem,traLoi:s.answers[id],dapAn:s.keyMap[id],phuongAnGoc:BY_ID[id].options||null,ketQua:grade(BY_ID[id],s.answers[id],s.keyMap[id])}))};download('ket-qua-gdqp-an-12.json',JSON.stringify(payload,null,2));toast('Đã xuất kết quả chi tiết.');}
async function importFile(file){if(!file)return;if(file.size>2000000){toast('File sao lưu quá lớn. Giới hạn 2 MB.');return;}let next;try{next=cleanState(JSON.parse(await file.text()));}catch{toast('File không phải bản sao lưu hợp lệ của trang này.');return;}modal('Nhập bản sao lưu?','Bản sao lưu sẽ thay dữ liệu hiện có trên trình duyệt này.',()=>{state=next;loadError=false;activeResult=null;save();navigate('home');tick();toast('Đã khôi phục tiến độ.');},'Nhập dữ liệu');}
function updateTimer(){const el=$('timer-text'),s=state.session;if(el&&s&&!s.finished){el.textContent=s.mode==='exam'?fmtTime(s.expires-Date.now()):'Không giới hạn';if($('timer'))$('timer').classList.toggle('urgent',s.mode==='exam'&&s.expires-Date.now()<120000);}}
function tick(){const s=state.session;if(s&&!s.finished&&s.mode==='exam'&&s.expires!==null&&Date.now()>=s.expires){finishSession(true);return;}updateTimer();}
document.addEventListener('click',ev=>{if(view==='quiz'&&state.session?.mode==='exam'&&!state.session.finished&&Date.now()>=state.session.expires){tick();return;}const b=ev.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
if(d.nav){navigate(d.nav);return;}if(d.topicStart){state.config.topic=d.topicStart;state.config.type='all';state.config.count='all';save();navigate('practice');return;}if(d.bookmark){const id=Number(d.bookmark);if(!BY_ID[id])return;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();render();return;}if(d.choice){const s=state.session;if(view!=='quiz'||!s||s.finished)return;const id=s.ids[quizIndex];if(s.checked[id])return;s.answers[id]={choice:d.choice};save();render();return;}if(d.tf){const s=state.session;if(view!=='quiz'||!s||s.finished)return;const id=s.ids[quizIndex];if(s.checked[id])return;s.answers[id][d.tf]=d.value==='true';save();render();return;}if(d.jump!==undefined){quizIndex=Number(d.jump);state.session.index=quizIndex;save();render();window.scrollTo({top:0,behavior:'instant'});return;}if(d.resultFilter){resultFilter=d.resultFilter;render();return;}if(d.bankMode){bankMode=d.bankMode;searchText='';render();return;}if(d.history!==undefined){activeResult=state.history[Number(d.history)];resultFilter='all';navigate('results');return;}
const act=d.action;if(act==='start')requestStart();else if(act==='resume')resume();else if(act==='check')checkQuestion();else if(act==='finish')requestFinish();else if(act==='prev'||act==='next'){quizIndex+=act==='next'?1:-1;state.session.index=quizIndex;save();render();window.scrollTo({top:0,behavior:'instant'});}else if(act==='retry-result'){const s=activeResult||state.session;requestStart(s.ids.filter(id=>{const g=grade(BY_ID[id],s.answers[id],s.keyMap[id]);return g.correct<g.total;}),'practice');}else if(act==='start-bank')requestStart(bankIds(),'practice');else if(act==='export'){download('sao-luu-gdqp-an-12.json',JSON.stringify(state,null,2));toast('Đã xuất bản sao lưu.');}else if(act==='export-result')exportResult();else if(act==='import')$('import-file').click();else if(act==='reset-keys')modal('Bỏ đáp án chỉnh riêng?','Các bài mới sẽ trở về đáp án mặc định của nguồn chấm đã chọn.',()=>{state.overrides={};save();render();toast('Đã bỏ đáp án chỉnh riêng.');},'Bỏ chỉnh riêng');else if(act==='reset')modal('Xóa dữ liệu học?','Toàn bộ tiến độ, bài làm, ghi chú và cài đặt của trang trên trình duyệt này sẽ bị xóa.',()=>{state=fresh();activeResult=null;loadError=false;save();navigate('home');toast('Đã xóa dữ liệu học của trang.');},'Xóa dữ liệu');});
document.addEventListener('change',ev=>{const el=ev.target,d=el.dataset||{};if(d.config){state.config[d.config]=el.type==='checkbox'?el.checked:d.config==='minutes'?Number(el.value):el.value;save();if($('setup-count'))$('setup-count').textContent=eligible().length+' câu phù hợp';}else if(el.name==='keyMode'){state.keyMode=el.value==='review'?'review':'source';save();toast('Đã đổi nguồn chấm cho các bài mới.');}else if(d.keyId){const id=Number(d.keyId),unit=d.keyUnit;state.overrides[id]||={};if(el.value==='')delete state.overrides[id][unit];else state.overrides[id][unit]=unit==='choice'?el.value:el.value==='true';if(!Object.keys(state.overrides[id]).length)delete state.overrides[id];save();toast('Đã lưu đáp án cho bài mới.');}else if(el.id==='bank-topic'){bankTopic=el.value;render();}else if(el.id==='import-file'){importFile(el.files?.[0]);el.value='';}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset?.note){state.notes[Number(el.dataset.note)]=el.value.slice(0,3000);save();}else if(el.id==='bank-search'){searchText=el.value;const pos=el.selectionStart;render();$('bank-search').focus();$('bank-search').setSelectionRange(pos,pos);}});
document.addEventListener('keydown',ev=>{if(!$('modal-root').innerHTML)return;if(ev.key==='Escape'){ev.preventDefault();closeModal();}if(ev.key==='Tab'){const first=$('modal-cancel'),last=$('modal-ok');if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',tick);
window.addEventListener('beforeunload',()=>save());
$('brand-mark').innerHTML=icon('book');$('settings-top').innerHTML=icon('settings');render();tick();setInterval(tick,1000);
</script>
